name: Build FiveStarPort installer verifier

on:
  push:
    branches: [main]
    paths:
      - installer-ci/**
      - .github/workflows/installer-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-toolchain
  cancel-in-progress: true

jobs:
  macos:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the installer verifier for Apple Silicon
        run: bash installer-ci/build.sh "$RUNNER_TEMP/installer-tools"
      - name: Test an OpenIV package and reject a mismatched payload digest
        run: python3 installer-ci/test/smoke.py "$RUNNER_TEMP/installer-tools/verify-install"
      - name: Package the verified utilities
        shell: bash
        run: |
          set -euo pipefail
          cp installer-ci/{README.md,LICENSE} "$RUNNER_TEMP/installer-tools/"
          mkdir -p "$RUNNER_TEMP/publish"
          cd "$RUNNER_TEMP/publish"
          tar -czf fivestarport-installer-verifier-macos-arm64.tar.gz -C "$RUNNER_TEMP/installer-tools" .
          shasum -a 256 fivestarport-installer-verifier-macos-arm64.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fivestarport-installer-verifier-macos-arm64
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the verified utilities for local use
        if: github.repository == 'ylt410/000' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="installer-verifier-${GITHUB_SHA:0:12}"
          cd "$RUNNER_TEMP/publish"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "FiveStarPort installer verifier ${GITHUB_SHA:0:12}" \
              --notes "Standalone Apple Silicon installer verifier. Compiled and tested with synthetic fixtures." \
              --draft --prerelease --latest=false
          fi
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            fivestarport-installer-verifier-macos-arm64.tar.gz SHA256SUMS.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
