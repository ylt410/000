name: Build and publish WSE iOS compatibility release

on:
  push:
    branches: [release/wse-ios-compat-v1.1]
    paths:
      - .github/workflows/release-wse-compat.yml
      - release-source/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wse-ios-compat-v1.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match the validated build compression library
        shell: bash
        run: |
          if python -c 'import sys,zlib; sys.exit(zlib.ZLIB_RUNTIME_VERSION != "1.3.2")'; then
            exit 0
          fi
          curl --fail --location --retry 3 https://zlib.net/fossils/zlib-1.3.2.tar.gz -o "$RUNNER_TEMP/wse-zlib.tar.gz"
          echo "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  $RUNNER_TEMP/wse-zlib.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wse-zlib.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/zlib-1.3.2"
          ./configure --prefix="$RUNNER_TEMP/wse-zlib"
          make -j2
          make install
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/wse-zlib/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Check source and unpack the reviewed builder
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile, zlib
          assert zlib.ZLIB_RUNTIME_VERSION == '1.3.2', zlib.ZLIB_RUNTIME_VERSION
          source = pathlib.Path('release-source/GTA5_WSE_Federal_iOS_Compat_v1.1_Source.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '7cb1207605be618bd4e487e9290919860679952cd4f736c261ead7996bf4697f'
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              assert all(not n.startswith('/') and '..' not in pathlib.Path(n).parts for n in z.namelist())
              z.extractall('build')
          target = pathlib.Path('build/dist')
          target.mkdir(exist_ok=True)
          (target/source.name).write_bytes(source.read_bytes())
          PY
      - name: Install the original-engine regression runtime
        run: python -m pip install -r build/requirements.txt
      - name: Fetch the original author's model pack and verify it
        shell: bash
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 https://files.gta5-mods.com/uploads/wanted-system-enhancement-federal-enforcement/43c097-wsefedpack.zip -o build/WSE_Federal_Enforcement_original.zip
          echo 'ad5e4956af450202078e2d5868bb8179012664d768a7afb5e72c4e777056e9cc  build/WSE_Federal_Enforcement_original.zip' | sha256sum --check --strict
      - name: Rebuild, check dependencies and verify exact release hashes
        shell: bash
        run: |
          python build/build_compat.py
          python build/verify_compat.py
          cd build/dist
          sha256sum --check --strict ../../release-source/SHA256SUMS.txt
          cp ../../release-source/SHA256SUMS.txt .
      - name: Upload assets and publish the tested release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload wse-ios-compat-v1.1 --repo "$GITHUB_REPOSITORY" --clobber build/dist/GTA5_WSE_Federal_iOS_Compat_v1.1.zip build/dist/GTA5_WSE_Federal_iOS_Compat_v1.1_Source.zip build/dist/SHA256SUMS.txt
          gh release edit wse-ios-compat-v1.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false --prerelease --notes-file release-source/release-notes.md
